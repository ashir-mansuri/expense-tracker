<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://open.er-api.com https://api.frankfurter.app; worker-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Tracker</title>
  <meta name="description" content="Personal expense tracker: bank statement import, budgets, insights and monthly reports. Your data stays on your phone.">
  <meta name="theme-color" content="#171E4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="display-700.woff" as="font" type="font/woff" crossorigin>
  <script src="prepaint.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
  <div id="sheet-backdrop" class="sheet-backdrop hidden" data-action="sheet-cancel"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="flow" class="flow hidden" role="dialog" aria-modal="true" aria-label="Add a bank statement"></div>
  <div id="lock" class="lock hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <noscript><p style="padding:24px;color:#4A5273">Expense Tracker needs JavaScript to run.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
